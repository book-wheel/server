spring.profiles.default=dev

app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

# Presigned URL 발급 후 메시지 저장 API가 호출되지 않은 채팅 임시 이미지를 회수한다.
chat.image.temp-retention=24h
chat.image.temp-cleanup-cron=0 0 3 * * *

# Presigned URL 발급 후 setupProfile이 호출되지 않은 프로필 임시 이미지를 회수한다.
profile.image.temp-retention=24h
profile.image.temp-cleanup-cron=0 30 3 * * *

# 탈퇴 후 보존기간이 끝난 회원 데이터와 동의 증빙을 매일 정리한다.
user.retention.cleanup-cron=0 15 4 * * *
user.retention.s3-cleanup-cron=0 */5 * * * *
user.onboarding.cleanup-cron=0 45 3 * * *

# Apple 갱신 토큰은 회원 탈퇴 시 연동 해제에 사용하며 AES-256-GCM으로 암호화해 보관한다.
# 운영 환경에서는 반드시 별도 비밀값으로 덮어쓴다. 구버전 키는 저장된 토큰이 모두 폐기되거나 재암호화될 때까지 유지한다.
app.oauth2.apple.token-encryption.active-key-version=${APPLE_TOKEN_ENCRYPTION_ACTIVE_KEY_VERSION:v1}
app.oauth2.apple.token-encryption.keys.v1=${APPLE_TOKEN_ENCRYPTION_KEY_V1:bG9jYWwtZGV2ZWxvcG1lbnQtYXBwbGUta2V5LTAwMDE=}
app.oauth2.apple.token-encryption.keys.v2=${APPLE_TOKEN_ENCRYPTION_KEY_V2:}
app.oauth2.apple.revocation-cron=${APPLE_TOKEN_REVOCATION_CRON:30 */5 * * * *}

# 동의 당사자 이메일 원본 대신 버전형 HMAC만 보관한다.
user.consent.identity-hmac.active-key-version=${CONSENT_HMAC_ACTIVE_KEY_VERSION:v1}
user.consent.identity-hmac.keys.v1=${CONSENT_HMAC_KEY_V1:local-development-consent-hmac-secret-change-me}
user.consent.identity-hmac.keys.v2=${CONSENT_HMAC_KEY_V2:}

# 서버가 인정하는 현재 약관 버전과 버전별 원문 SHA-256이다. 아래 해시는 로컬 개발 기본값이다.
user.consent.policy.terms.version=${TERMS_POLICY_VERSION:2026-09-01}
user.consent.policy.terms.document-hash=${TERMS_POLICY_DOCUMENT_HASH:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
user.consent.policy.privacy.version=${PRIVACY_POLICY_VERSION:2026-09-01}
user.consent.policy.privacy.document-hash=${PRIVACY_POLICY_DOCUMENT_HASH:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}
user.consent.policy.marketing.version=${MARKETING_POLICY_VERSION:2026-09-01}
user.consent.policy.marketing.document-hash=${MARKETING_POLICY_DOCUMENT_HASH:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc}

# Expo 푸시 서비스에서 EAS의 강화된 푸시 보안을 사용하면 EXPO_ACCESS_TOKEN을 설정한다.
expo.push.url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
expo.push.receipts-url=${EXPO_PUSH_RECEIPTS_URL:https://exp.host/--/api/v2/push/getReceipts}
expo.push.access-token=${EXPO_ACCESS_TOKEN:}
expo.push.retry-initial-delay-ms=${EXPO_PUSH_RETRY_INITIAL_DELAY_MS:500}
expo.push.receipt-check-interval-ms=${EXPO_PUSH_RECEIPT_CHECK_INTERVAL_MS:60000}
expo.push.receipt-check-initial-delay-ms=${EXPO_PUSH_RECEIPT_CHECK_INITIAL_DELAY_MS:60000}
