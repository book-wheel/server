spring.profiles.default=dev

app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

# Presigned URL 발급 후 메시지 저장 API가 호출되지 않은 채팅 임시 이미지를 회수한다.
chat.image.temp-retention=24h
chat.image.temp-cleanup-cron=0 0 3 * * *

# Expo Push Service. Set EXPO_ACCESS_TOKEN when enhanced push security is enabled in EAS.
expo.push.url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
expo.push.receipts-url=${EXPO_PUSH_RECEIPTS_URL:https://exp.host/--/api/v2/push/getReceipts}
expo.push.access-token=${EXPO_ACCESS_TOKEN:}
expo.push.retry-initial-delay-ms=${EXPO_PUSH_RETRY_INITIAL_DELAY_MS:500}
expo.push.receipt-check-interval-ms=${EXPO_PUSH_RECEIPT_CHECK_INTERVAL_MS:60000}
expo.push.receipt-check-initial-delay-ms=${EXPO_PUSH_RECEIPT_CHECK_INITIAL_DELAY_MS:60000}
